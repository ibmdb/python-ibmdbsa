[egg_info]
tag_build =

[tool:pytest]
addopts = --tb native -v -r fxX
python_files = test/*test_*.py
# Markers used by SQLAlchemy's test suite.
markers =
    backend
    sparse_backend
    sparse_driver_backend
    mypy
    memory_intensive
    timing_intensive

[sqla_testing]
requirement_cls = ibm_db_sa.requirements:Requirements
profile_file = test/profiles.txt

[db]
# 'default' is used when neither --dburi nor --db is passed. Keep it as
# sqlite in-memory so the OFFLINE tests (test/test_dialect.py) run with no
# Db2 available. The named 'db2' entry below is selected only with
# '--db db2' (or override per-run with --dburi).
#
# NOTE: Do NOT commit real credentials here. Point 'db2' at your own Db2
# instance locally, or prefer passing the URL per-run with
#   pytest --dburi "ibm_db_sa://user:pass@host:port/DBNAME" test/
default = sqlite:///:memory:
sqlite = sqlite:///:memory:
db2 = ibm_db_sa://user:pass@host:port/DBNAME
